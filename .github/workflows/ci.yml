name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet build backend/SurubDirect.sln --configuration Release
      - run: dotnet test backend/SurubDirect.sln --configuration Release --no-build
      - run: npm ci
        working-directory: frontend
      - run: npx ng build storefront && npx ng build admin
        working-directory: frontend
