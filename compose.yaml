name: surub-direct
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: surub_direct
      POSTGRES_USER: surub_direct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surub_direct -d surub_direct"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
