<form #form="ngForm" (ngSubmit)="submit(form)">
  <fieldset [disabled]="busy()">
    <legend>Alege o parolă nouă</legend>
    <p>12–128 de caractere, cu literă mare, literă mică, cifră și simbol.</p>
    <label
      >Parola nouă<input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="12"
        maxlength="128"
        autocomplete="new-password"
    /></label>
    <label
      >Repetă parola nouă<input
        name="confirmation"
        type="password"
        [(ngModel)]="confirmation"
        required
        maxlength="128"
        autocomplete="new-password"
    /></label>
    <button type="submit">Schimbă parola</button>
  </fieldset>
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
</form>
