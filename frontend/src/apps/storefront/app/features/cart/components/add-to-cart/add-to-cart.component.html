<form #form="ngForm" (ngSubmit)="submit(form)">
  <label
    >Număr ambalaje<input
      type="number"
      name="packs"
      [ngModel]="packs()"
      (ngModelChange)="packs.set($event)"
      [min]="offer().minPacks"
      [step]="offer().packStep"
      [max]="available() / offer().unitsPerPack"
      required
      [disabled]="!priced()" /></label
  ><button
    [disabled]="
      form.invalid ||
      cart.locked() ||
      !priced() ||
      available() < offer().minPacks * offer().unitsPerPack
    "
  >
    {{ existing() ? 'Actualizează coșul' : 'Adaugă în coș' }}
  </button>
</form>
@if (message()) {
  <p role="status">{{ message() }}</p>
}
<p>Destinația butonului de mai sus: coșul browserului.</p>
<a routerLink="/cos">Vezi coșul browserului</a>
<sd-add-to-account [selection]="accountSelection()" />
