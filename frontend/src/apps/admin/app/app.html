<header>
  <a class="brand" href="http://localhost:4200">⬢ șurub<span>direct</span></a
  ><span class="admin-label">ADMINISTRARE</span>
  @if (session.authenticated()) {
    <nav aria-label="Administrare">
      <a routerLink="/catalog" routerLinkActive="active" ariaCurrentWhenActive="page">Produse</a
      ><a routerLink="/categorii" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Categorii și atribute</a
      >
      <a routerLink="/import-produse" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Import CSV</a
      >
      <a routerLink="/furnizori" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Furnizori</a
      >
      <a routerLink="/mesagerie" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Mesagerie</a
      >
      <a routerLink="/comenzi" routerLinkActive="active" ariaCurrentWhenActive="page">Comenzi</a>
      <a routerLink="/aprovizionare" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Aprovizionare</a
      >
    </nav>
    <button mat-stroked-button (click)="logout()">Deconectare</button>
  }
</header>
@if (error()) {
  <p role="alert">{{ error() }}</p>
}
<router-outlet />
