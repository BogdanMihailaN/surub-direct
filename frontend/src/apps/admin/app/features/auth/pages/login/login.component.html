<main class="login">
  <span class="eyebrow">SPAȚIUL TĂU DE LUCRU</span>
  <h1>Bine ai revenit.</h1>
  <p>Autentifică-te pentru a gestiona catalogul și stocurile.</p>
  <form #form="ngForm" (ngSubmit)="login(form)">
    <mat-form-field appearance="outline"
      ><mat-label>Adresă e-mail</mat-label
      ><input
        matInput
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Parolă</mat-label
      ><input
        matInput
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password" /></mat-form-field
    ><button mat-flat-button type="submit" [disabled]="busy()">
      {{ busy() ? 'Se verifică…' : 'Autentificare' }}
    </button>
  </form>
  @if (error()) {
    <p role="alert" class="error">{{ error() }}</p>
  }
</main>
