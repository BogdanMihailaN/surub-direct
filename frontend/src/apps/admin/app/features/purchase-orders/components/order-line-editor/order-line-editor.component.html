<form #form="ngForm" (ngSubmit)="submit(form)">
  <label
    >Ambalaje comandate<input
      type="number"
      name="packs"
      [(ngModel)]="packs"
      min="1"
      max="2147483647"
      step="1"
      required
      [disabled]="disabled()" /></label
  ><label
    >Cost net negociat per ambalaj<input
      type="number"
      name="cost"
      [(ngModel)]="cost"
      min="0.000001"
      max="1000000"
      step="0.000001"
      required
      [disabled]="disabled()"
  /></label>
  <div class="actions">
    <button [disabled]="disabled() || form.invalid">Salvează linia</button
    ><button type="button" [disabled]="disabled()" (click)="cancelled.emit()">Renunță</button>
  </div>
</form>
