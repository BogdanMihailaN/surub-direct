<form (ngSubmit)="applied.emit({ status, number, returnStatus })">
  <label
    >Număr comandă<input
      name="number"
      [(ngModel)]="number"
      placeholder="DEMO-00000001"
      maxlength="30"
  /></label>
  <label
    ><span id="order-status-label">Stare comandă</span
    ><select name="status" [(ngModel)]="status" aria-labelledby="order-status-label">
      <option value="">Toate stările</option>
      <option value="Confirming">Confirmare în curs</option>
      <option value="Confirmed">Confirmată</option>
      <option value="Cancelling">Anulare în curs</option>
      <option value="Cancelled">Anulată</option>
      <option value="Failed">Confirmare nereușită</option>
    </select></label
  >
  <label><span id="return-status-label">Stare retur</span>
    <select name="returnStatus" [(ngModel)]="returnStatus" aria-labelledby="return-status-label">
      <option value="">Toate stările returului</option>
      @for (option of returnOptions; track option[0]) { <option [value]="option[0]">{{ option[1] }}</option> }
    </select>
  </label>
  <button type="submit" [disabled]="busy()">Aplică filtrele</button>
</form>
