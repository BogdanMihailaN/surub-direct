<form class="panel form-grid" #form="ngForm" (ngSubmit)="submit(form)">
  <h2 class="full">Editează produsul</h2>
  <p class="full">
    Adresa rămâne /produse/{{ product().slug }}. Modificările unui produs publicat apar imediat în
    magazin.
  </p>
  <fieldset [disabled]="busy()">
    <mat-form-field appearance="outline">
      <mat-label>Denumire produs</mat-label>
      <input matInput name="name" [(ngModel)]="details.name" required maxlength="200" />
    </mat-form-field>
    <label class="select-label"
      >Categorie<select name="categoryId" [(ngModel)]="details.categoryId" required>
        <option value="">Alege categoria</option>
        @for (option of options(); track option.category.id) {
          <option [value]="option.category.id">{{ option.path }}</option>
        }
      </select></label
    >
    <mat-form-field appearance="outline" class="full">
      <mat-label>Descriere</mat-label>
      <textarea
        matInput
        name="description"
        [(ngModel)]="details.description"
        required
        maxlength="4000"
        rows="5"
      ></textarea>
    </mat-form-field>
    <div class="full">
      <button mat-flat-button type="submit" [disabled]="form.invalid || busy()">
        Salvează modificările
      </button>
      <button mat-button type="button" [disabled]="busy()" (click)="cancelled.emit()">
        Renunță la editare
      </button>
    </div>
  </fieldset>
</form>
