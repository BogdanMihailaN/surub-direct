<form class="panel form-grid" #form="ngForm" (ngSubmit)="submit(form)">
  <fieldset [disabled]="busy()">
    <mat-form-field appearance="outline"
      ><mat-label>Denumire produs</mat-label
      ><input
        matInput
        name="name"
        [(ngModel)]="product.name"
        required
        maxlength="200" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Adresă URL (slug)</mat-label
      ><input
        matInput
        name="slug"
        [(ngModel)]="product.slug"
        required
        pattern="[a-z0-9]+(-[a-z0-9]+)*"
        placeholder="surub-pentru-lemn" /></mat-form-field
    ><label class="select-label"
      >Categorie<select name="categoryId" [(ngModel)]="product.categoryId" required>
        <option value="">Alege categoria</option>
        @for (option of options(); track option.category.id) {
          <option [value]="option.category.id">{{ option.path }}</option>
        }
      </select></label
    ><mat-form-field appearance="outline" class="full"
      ><mat-label>Descriere</mat-label
      ><textarea
        matInput
        name="description"
        [(ngModel)]="product.description"
        required
        rows="4"
        maxlength="4000"
      ></textarea></mat-form-field
    ><button mat-flat-button type="submit" [disabled]="form.invalid || busy()">
      Creează ciorna
    </button>
  </fieldset>
</form>
